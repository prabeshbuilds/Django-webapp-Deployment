name: Django CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

env:
  PYTHON_VERSION: "3.12"
  APP_NAME: django-cicd

jobs:
  ci:
    name: CI - Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django checks
        run: python manage.py check

      - name: Run tests
        run: python manage.py test

      - name: Validate Docker Compose
        run: docker compose config

  docker:
    name: CI - Build Docker Image
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.APP_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: CD - Push Image to Docker Hub
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/django-cicd

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Skip publish when Docker Hub secrets are missing
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == ''
        run: echo "Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN to publish the image."

      - name: Set up Docker Buildx
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Build and push image
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: CD - Deploy to EC2
    runs-on: ubuntu-latest
    needs: publish
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
      EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
      EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
      DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
      DJANGO_ALLOWED_HOSTS: ${{ secrets.DJANGO_ALLOWED_HOSTS }}
      REPO_URL: https://github.com/${{ github.repository }}.git
      BRANCH_NAME: ${{ github.ref_name }}

    steps:
      - name: Skip deploy when secrets are missing
        if: env.DOCKERHUB_USERNAME == '' || env.DOCKERHUB_TOKEN == '' || env.EC2_HOST == '' || env.EC2_USER == '' || env.EC2_SSH_KEY == '' || env.DJANGO_SECRET_KEY == '' || env.DJANGO_ALLOWED_HOSTS == ''
        run: echo "Set Docker Hub, EC2, and Django secrets to enable deployment."

      - name: Deploy with Docker Compose
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' && env.EC2_HOST != '' && env.EC2_USER != '' && env.EC2_SSH_KEY != '' && env.DJANGO_SECRET_KEY != '' && env.DJANGO_ALLOWED_HOSTS != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.EC2_HOST }}
          username: ${{ env.EC2_USER }}
          key: ${{ env.EC2_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,DOCKERHUB_TOKEN,EC2_APP_DIR,DJANGO_SECRET_KEY,DJANGO_ALLOWED_HOSTS,REPO_URL,BRANCH_NAME
          script: |
            set -e

            APP_DIR="${EC2_APP_DIR:-$HOME/django-cicd}"
            IMAGE_NAME="$DOCKERHUB_USERNAME/django-cicd:latest"

            if [ ! -d "$APP_DIR/.git" ]; then
              mkdir -p "$APP_DIR"
              git clone --branch "$BRANCH_NAME" "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin "$BRANCH_NAME"
            git checkout "$BRANCH_NAME"
            git pull --ff-only origin "$BRANCH_NAME"

            echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

            cat > .env.production <<EOF
            DOCKER_IMAGE=$IMAGE_NAME
            DJANGO_SECRET_KEY=$DJANGO_SECRET_KEY
            DJANGO_ALLOWED_HOSTS=$DJANGO_ALLOWED_HOSTS
            EOF

            docker compose --env-file .env.production -f docker-compose.prod.yml pull
            docker compose --env-file .env.production -f docker-compose.prod.yml up -d
            docker compose --env-file .env.production -f docker-compose.prod.yml exec -T web python manage.py migrate
